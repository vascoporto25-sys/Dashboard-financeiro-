<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Caching theme to localStorage
        const setTheme = (theme) => {
            document.body.classList.toggle('dark-mode', theme === 'dark');
            localStorage.setItem('theme', theme);
        };

        const loadTheme = () => {
            const theme = localStorage.getItem('theme') || 'light';
            setTheme(theme);
        };

        const toggleTheme = () => {
            const currentTheme = localStorage.getItem('theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        };

        // Error handling with retry logic
        const fetchData = async (url, retries = 3) => {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return await response.json();
            } catch (error) {
                if (retries > 0) {
                    console.error('Fetch failed, retries left:', retries);
                    return fetchData(url, retries - 1);
                } else {
                    console.error('Fetch error:', error);
                    alert('Failed to fetch data');
                }
            }
        };

        const renderChart = (data) => {
            const ctx = document.getElementById('myChart');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Financial Data',
                        data: data.values,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        };

        const initDashboard = async () => {
            loadTheme();
            const data = await fetchData('api/financial-data');
            renderChart(data);
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            initDashboard();
        });
    </script>
</head>
<body>
    <header>
        <h1>Financial Dashboard</h1>
        <button id="theme-toggle">Toggle Dark Mode</button>
    </header>
    <main>
        <section id="metrics">
            <h2>Metrics</h2>
            <!-- Metrics Overview Here -->
        </section>
        <section id="charts">
            <h2>Charts</h2>
            <canvas id="myChart"></canvas>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Dashboard Finance. All rights reserved.</p>
    </footer>
</body>
</html>
